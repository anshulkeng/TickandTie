name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies (CPU-only torch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -i '^torch==' requirements.lock.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock.txt

      - name: Run tests
        env:
          EDGAR_IDENTITY: "Tick and Tie CI ci@example.com"
        run: python -m pytest -q